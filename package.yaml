name: mu
version: 0.1.0.0
github: Futarimiti/mu
license: MIT
author: Carman Fu
license-file: LICENSE
maintainer: futarimiti@163.com
copyright: Carman Fu 2024
extra-source-files:
  - README.md
synopsis: Personal music downloader & player
# ?
category: Sound
description: Please see the README on GitHub at <https://github.com/Futarimiti/mu#readme>
data-dir: resources
data-files:
  - messages.dhall
  - fileinfo.dhall
default-extensions:
  - DataKinds
  - DeriveGeneric
  - DeriveAnyClass
  - InstanceSigs
dependencies:
  - base >= 4.7 && < 5
  - optparse-applicative
  - transformers ^>=0.6.0.0
  - dhall
  - process
  - text
  - directory
  - filepath
  - temporary
  - yaml
  - bytestring
  - containers
  - serialise
  - random-shuffle
ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wmonomorphism-restriction
  - -O2
executables:
  mu:
    main: Main.hs
    source-dirs:
      - app
      - src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
